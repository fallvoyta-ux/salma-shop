services:
  - type: web
    name: salmashop
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node src/server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_NAME
        value: Salma Shop
      - key: STORE_PHONE
        value: "+221 77 201 86 97"
      - key: STORE_WHATSAPP
        value: "221772018697"
      - key: STORE_EMAIL
        value: contact@salmashop.sn
      - key: STORE_ADDRESS
        value: "Dakar, Sénégal"
      - key: DEFAULT_CURRENCY
        value: FCFA
      - key: PAYMENT_MODE
        value: test
      - key: JWT_SECRET
        generateValue: true
      # Secrets et connexions : valeurs saisies UNIQUEMENT dans le tableau de bord
      # Render (Environment). sync: false = jamais stockées dans ce fichier versionné.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DEFAULT_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_BUSINESS_ID
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: ORANGE_MONEY_MERCHANT_KEY
        sync: false
