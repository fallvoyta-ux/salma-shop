databases:
  - name: salmashop-db
    databaseName: salmashop
    user: salmashop_user
    plan: free

services:
  - type: web
    name: salmashop
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node src/server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: salmashop-db
          property: connectionString
      - key: STORE_NAME
        value: Salma Shop
      - key: STORE_PHONE
        value: "+221 77 201 86 97"
      - key: STORE_WHATSAPP
        value: "221772018697"
      - key: STORE_EMAIL
        value: contact@salmashop.sn
      - key: STORE_ADDRESS
        value: "Dakar, Sénégal"
      - key: DEFAULT_CURRENCY
        value: FCFA
      - key: PAYMENT_MODE
        value: test
      # Render génère et protège ce secret automatiquement dans son coffre sécurisé
      - key: JWT_SECRET
        generateValue: true
      # Identifiants administrateur : saisis UNIQUEMENT dans le Dashboard Render (jamais versionnés)
      - key: ADMIN_DEFAULT_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: WAVE_BUSINESS_ID
        value: "M_5iS6VUrJnTx-"
      # Variables d'intégration tierces (saisies dans le Dashboard Render)
      - key: CLOUDINARY_URL
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: ORANGE_MONEY_MERCHANT_KEY
        sync: false
      - key: ORANGE_MONEY_CLIENT_ID
        sync: false
      - key: ORANGE_MONEY_CLIENT_SECRET
        sync: false
      - key: PAYTECH_API_KEY
        sync: false
      - key: PAYTECH_API_SECRET
        sync: false
